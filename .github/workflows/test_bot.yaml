name: Test bot (bot-testing-area only)

# Manual smoke test against https://www.metaculus.com/tournament/bot-testing-area/
# Never touches tournament questions. Shares the concurrency group with the live
# workflow so the two can never run at the same time. Runs the bot from the private
# repository at the branch given below (default: main).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch of the bot to test"
        required: false
        default: main
      free_tier:
        description: "Also use the free Gemini tier (off = Vertex only, the day's free quota stays for the tournaments)"
        required: false
        default: "on"

concurrency:
  group: forecast
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # keyless Google Cloud sign-in (Vertex AI): GitHub's OIDC token, no stored key

jobs:
  test_questions:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out the bot
        uses: actions/checkout@v4
        with:
          repository: Sky-Blue1111/forecast-bot-core
          ref: ${{ inputs.ref || 'main' }}
          token: ${{ secrets.CORE_REPO_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install --quiet -r requirements.txt

      # Vertex AI (the owner's Google Cloud free-trial credit) through Workload Identity
      # Federation: only runs of this repository may sign in. On failure the bot uses the
      # free tier.
      - name: Google Cloud sign-in for Vertex AI (keyless)
        if: vars.GCP_WIF_PROVIDER != ''
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Forecast on the bot-testing-area tournament
        timeout-minutes: 45
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ inputs.free_tier != 'off' && secrets.GEMINI_API_KEY || '' }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }} # optional; empty = Tavily keyless mode
          BOT_VERTEX_CONFIGURED: ${{ vars.GCP_WIF_PROVIDER != '' && '1' || '' }}
        run: python main.py --mode test_questions --status-out status_test.json

      - name: Keep the run's counts (no forecast content)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-test
          path: status_test.json
          if-no-files-found: ignore
          retention-days: 30
