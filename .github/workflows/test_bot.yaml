name: Test bot (bot-testing-area only)

# Manual smoke test against https://www.metaculus.com/tournament/bot-testing-area/
# Never touches tournament questions. Shares the concurrency group with the live
# workflow so the two can never run at the same time. Runs the bot from the private
# repository at the branch given below (default: main).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch of the bot to test"
        required: false
        default: main

concurrency:
  group: forecast
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test_questions:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out the bot
        uses: actions/checkout@v4
        with:
          repository: Sky-Blue1111/forecast-bot-core
          ref: ${{ inputs.ref || 'main' }}
          token: ${{ secrets.CORE_REPO_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Forecast on the bot-testing-area tournament
        timeout-minutes: 45
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }} # optional; empty = Tavily keyless mode
        run: python main.py --mode test_questions --status-out status_test.json

      - name: Keep the run's counts (no forecast content)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-test
          path: status_test.json
          if-no-files-found: ignore
          retention-days: 30
